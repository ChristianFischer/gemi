name: 'Install System Dependencies'
description: 'Install system packages required for building the workspace'
inputs:
  profile:
    description: 'Dependency profile: full, openssl, or release'
    required: true
    default: 'full'

runs:
  using: "composite"
  steps:
    # Profile: full – all dependencies for clippy and nightly release builds
    # (SDL3, ALSA, udev, OpenSSL, SQLite, OpenGL, pkg-config)
    - name: Install system dependencies (full)
      if: inputs.profile == 'full'
      run: |
        apt-get update && apt-get install -y \
          build-essential \
          libsdl3-dev \
          libasound2-dev \
          libudev-dev \
          libssl-dev \
          libsqlite3-dev \
          libgl1-mesa-dev \
          pkg-config \
          && rm -rf /var/lib/apt/lists/*
      shell: bash

    # Profile: openssl – minimal dependencies for reqwest/HTTPS (ROM downloads)
    - name: Install system dependencies (openssl)
      if: inputs.profile == 'openssl'
      run: |
        apt-get update && apt-get install -y \
          pkg-config \
          libssl-dev \
          && rm -rf /var/lib/apt/lists/*
      shell: bash

    # Profile: release – full dependencies plus zip for release packaging
    - name: Install system dependencies (release)
      if: inputs.profile == 'release'
      run: |
        apt-get update && apt-get install -y \
          build-essential \
          libsdl3-dev \
          libasound2-dev \
          libudev-dev \
          libssl-dev \
          libsqlite3-dev \
          libgl1-mesa-dev \
          pkg-config \
          zip \
          && rm -rf /var/lib/apt/lists/*
      shell: bash
