[package]
name = "gemi-debugger"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.37", default-features = true, features = [ "default_fonts", "glow", "persistence", ] }
egui = { version = "0.37", default-features = true }
egui_extras = { version = "0.37", default-features = false, features = [] }
egui_tiles = { version = "0.18", default-features = false, features = ["serde"] }
lazy_static = { version = "1.5", default-features = false, features = [] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }

# desktop:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = "0.3"

# wasm:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"


[dependencies.libgemi]
path = "../../lib/gemi"
features = [
    "cgb",
    "debug_interface",
    "serde",
    "snapshots",
]

[dependencies.gemi-utils]
path = "../../lib/utils"

